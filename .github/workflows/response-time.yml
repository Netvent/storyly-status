name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: ${{ github.repository }}-${{ github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  response-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
