name: Graphs CI
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.repository }}-${{ github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # branch tip, not the event SHA: a run queued behind another push would otherwise be rejected
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
