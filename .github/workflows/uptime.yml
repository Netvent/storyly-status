name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: ${{ github.repository }}-${{ github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # branch tip, not the event SHA: a run queued behind another push would otherwise be rejected
          ref: ${{ github.ref_name }}
      - uses: upptime/uptime-monitor@v1.44.1
        with:
          command: "uptime"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
